<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spoke &amp; Chain Saturday Fix-It Clinic: A3 Poster</title>
<style>
  :root {
    --ink: #111111;
    --paper: #ffffff;
    --accent: #ffd400;
    --font: "Arial Black", "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
    --text: Helvetica, Arial, "Liberation Sans", "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #d9d9d9;
    color: var(--paper);
    font-family: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 16px;
    overflow-x: hidden;
  }

  /* Poster: fluid on screen, fixed A3 portrait in print */
  .poster {
    width: 100%;
    max-width: 880px;
    background: var(--ink);
    color: var(--paper);
    padding: clamp(20px, 5vw, 56px);
    display: flex;
    flex-direction: column;
    gap: clamp(18px, 3.5vw, 36px);
    position: relative;
    overflow-wrap: break-word;
    align-self: flex-start;
  }

  .top {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px 16px;
    border-bottom: 4px solid var(--accent);
    padding-bottom: 14px;
  }
  .brand {
    margin: 0;
    font-family: var(--font);
    font-size: clamp(1.1rem, 3.2vw, 1.9rem);
    text-transform: uppercase;
    letter-spacing: 0.02em;
    color: var(--accent);
  }
  .kicker {
    margin: 0;
    font-size: clamp(0.85rem, 2.2vw, 1.15rem);
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  h1 {
    margin: 0;
    font-family: var(--font);
    font-weight: 900;
    text-transform: uppercase;
    line-height: 0.92;
    letter-spacing: -0.02em;
    font-size: clamp(2.7rem, 12.5vw, 8.5rem);
  }
  h1 .line { display: block; }
  h1 .accent { color: var(--accent); }

  .free {
    margin: 0;
    background: var(--accent);
    color: var(--ink);
    font-family: var(--font);
    font-weight: 900;
    text-transform: uppercase;
    font-size: clamp(1.5rem, 5.6vw, 3.6rem);
    line-height: 1.05;
    padding: 0.35em 0.5em;
    align-self: flex-start;
  }

  .info {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 18px;
  }
  .block {
    border: 4px solid var(--paper);
    padding: 16px 18px 18px;
  }
  .label {
    margin: 0 0 8px;
    font-size: clamp(0.8rem, 2vw, 1rem);
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--accent);
  }
  .big {
    margin: 0;
    font-family: var(--font);
    font-weight: 900;
    text-transform: uppercase;
    font-size: clamp(1.6rem, 5vw, 3.2rem);
    line-height: 1.05;
  }
  .med {
    margin: 8px 0 0;
    font-family: var(--font);
    font-weight: 900;
    font-size: clamp(1.3rem, 4vw, 2.4rem);
    line-height: 1.1;
    color: var(--accent);
  }

  .lead {
    margin: 0;
    font-size: clamp(1.05rem, 2.8vw, 1.5rem);
    line-height: 1.4;
    max-width: 40em;
  }

  .foot {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    border-top: 4px solid var(--accent);
    padding-top: 16px;
  }
  .foot p {
    margin: 0;
    font-family: var(--font);
    font-weight: 900;
    text-transform: uppercase;
    font-size: clamp(0.95rem, 2.6vw, 1.4rem);
  }
  .wheel {
    width: clamp(70px, 16vw, 130px);
    height: auto;
    flex: 0 0 auto;
  }

  /* Print: exactly one A3 portrait page, artwork filling it */
  @page {
    size: A3 portrait;
    margin: 0;
  }
  @media print {
    html, body {
      width: 297mm;
      height: 420mm;
      margin: 0 !important;
      padding: 0 !important;
      background: var(--ink) !important;
      display: block;
      min-height: 0;
      overflow: hidden;
    }
    .poster {
      width: 297mm;
      height: 420mm;
      max-width: none;
      min-height: 0;
      padding: 20mm 20mm 18mm;
      gap: 12mm;
      justify-content: space-between;
      overflow: hidden;
      align-self: auto;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .brand { font-size: 22pt; }
    .kicker { font-size: 14pt; }
    .top { padding-bottom: 4mm; border-bottom-width: 1.4mm; }
    h1 { font-size: 118pt; line-height: 0.92; }
    .free { font-size: 40pt; padding: 3mm 5mm; }
    .info { grid-template-columns: 1fr 1fr; gap: 6mm; }
    .block { border-width: 1.2mm; padding: 6mm; }
    .label { font-size: 12pt; margin-bottom: 3mm; }
    .big { font-size: 34pt; }
    .med { font-size: 26pt; margin-top: 3mm; }
    .lead { font-size: 20pt; }
    .foot { border-top-width: 1.4mm; padding-top: 5mm; }
    .foot p { font-size: 16pt; }
    .wheel { width: 40mm; }
  }
</style>
</head>
<body>
<main class="poster" id="poster">

  <header class="top">
    <p class="brand">Spoke &amp; Chain</p>
    <p class="kicker">Neighborhood bike repair shop</p>
  </header>

  <h1>
    <span class="line">Saturday</span>
    <span class="line accent">Fix-It</span>
    <span class="line">Clinic</span>
  </h1>

  <p class="free">Free safety checks</p>

  <section class="info" aria-label="When and where">
    <div class="block">
      <p class="label">When</p>
      <p class="big">Saturdays</p>
      <p class="med">10am to 2pm</p>
    </div>
    <div class="block">
      <p class="label">Where</p>
      <p class="big">12 Mill Lane</p>
    </div>
  </section>

  <p class="lead">Bring your bike to Spoke &amp; Chain for a free safety check at our Saturday Fix-It Clinic, Saturdays 10am to 2pm at 12 Mill Lane.</p>

  <footer class="foot">
    <p>Spoke &amp; Chain &middot; 12 Mill Lane</p>
    <svg class="wheel" viewBox="0 0 120 120" role="img" aria-label="Bicycle wheel illustration">
      <circle cx="60" cy="60" r="54" fill="none" stroke="#ffd400" stroke-width="8"/>
      <circle cx="60" cy="60" r="8" fill="#ffd400"/>
      <g stroke="#ffd400" stroke-width="3" fill="none">
        <line x1="60" y1="52" x2="60" y2="6"/>
        <line x1="60" y1="68" x2="60" y2="114"/>
        <line x1="52" y1="60" x2="6" y2="60"/>
        <line x1="68" y1="60" x2="114" y2="60"/>
        <line x1="54" y1="54" x2="20" y2="20"/>
        <line x1="66" y1="66" x2="100" y2="100"/>
        <line x1="66" y1="54" x2="100" y2="20"/>
        <line x1="54" y1="66" x2="20" y2="100"/>
      </g>
    </svg>
  </footer>

</main>
</body>
</html>
