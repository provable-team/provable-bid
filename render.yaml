# Render Blueprint for provable.bid (secrets are set in the dashboard or API, never here: `sync: false` declares them).
#
# Note: no Render Blueprint is linked to this repo today. The two live services were created directly, so editing this
# file changes nothing on Render until someone creates a Blueprint from it (or applies the same settings in the
# dashboard / API). Keep it matching the live services.
#
# Live today (2026-11-12): API on Starter with state in Neon Postgres (DATABASE_URL) and RUNNER=workflows; web on
# free with the custom domain provable.bid; the workflow service provable-race-workflows. Data survives deploys.
#
# Build filters: a push deploys a service only when it changes files that service actually runs. Docs-only pushes
# deploy nothing; web-only pushes leave the API alone. The API also deploys for docs/agents.md and examples/**,
# which it serves at /agent-guide.md and /examples/agent.mjs. https://render.com/docs/monorepo-support#setting-build-filters
services:
  - type: web
    name: provable-race-api
    runtime: node
    plan: starter
    branch: shiwani/proof-race
    # As live. A prebuilt bundle also works (`npm run api:build`, then `node dist/api-server.mjs`; tested, docs
    # routes included) and boots faster; switch when convenient.
    buildCommand: npm ci --include=dev
    startCommand: npx tsx apps/api/src/server.ts
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - contracts/**
        - scripts/**
        - docs/agents.md
        - examples/**
        - package.json
        - package-lock.json
        - tsconfig.json
        - render.yaml
    envVars:
      - { key: NODE_VERSION, value: "24" }
      - { key: NODE_ENV, value: production }
      - { key: PAYMENTS, value: paypal }
      - { key: WEB_ORIGIN, value: https://provable.bid }
      - { key: CORS_ORIGINS, value: "https://provable-race-web.onrender.com,https://www.provable.bid" }
      - { key: API_ORIGIN, value: https://provable-race-api.onrender.com }
      - { key: DATABASE_PATH, value: data/api.db }
      - { key: PAYPAL_CLIENT_ID, sync: false }
      - { key: PAYPAL_CLIENT_SECRET, sync: false }
      - { key: PAYPAL_WEBHOOK_ID, sync: false }
      - { key: HOUSE_OPERATOR_PAYER_ID, sync: false }
      - { key: ADMIN_TOKEN, sync: false }
      - { key: ANTHROPIC_API_KEY, sync: false }
      - { key: KERNEL_API_KEY, sync: false }
      - { key: KEEP_ALIVE_URLS, sync: false }
      # Durable state: Neon Postgres (live). Without DATABASE_URL the API falls back to SQLite (tests, local dev).
      - { key: DATABASE_URL, sync: false }
      - { key: DATABASE_URL_UNPOOLED, sync: false }
      # Render Workflows (provable-race-workflows below): live with RUNNER=workflows; unset RUNNER to run in-process.
      - { key: RUNNER, sync: false }
      - { key: WORKFLOWS_SECRET, sync: false }
      - { key: RENDER_API_KEY, sync: false }
  - type: web
    name: provable-race-web
    runtime: node
    plan: free
    branch: shiwani/proof-race
    buildCommand: npm ci --include=dev && npm run web:build
    startCommand: cd apps/web && npx next start -p $PORT
    healthCheckPath: /
    buildFilter:
      paths:
        - apps/web/**
        - packages/**
        - contracts/**
        - package.json
        - package-lock.json
        - render.yaml
      ignoredPaths:
        - "**/*.md"
        - apps/web/tests/**
    envVars:
      - { key: NODE_VERSION, value: "24" }
      - { key: NEXT_PUBLIC_API_BASE_URL, value: https://provable-race-api.onrender.com }
      - { key: KEEP_ALIVE_URLS, sync: false }
      - { key: NEXT_PUBLIC_AG_STUDIO_LICENSE_KEY, sync: false }

  # Render Workflows: house-agent builds and submission evaluation (apps/api/src/workflows), used when the API has
  # RUNNER=workflows. No free tier: runs bill per second of compute (flex plan) plus $0.25/GB-month of retained run
  # state, against the workspace's credits. https://render.com/docs/workflows  https://render.com/docs/workflows-limits
  - type: workflow
    name: provable-race-workflows
    runtime: node
    region: oregon
    branch: shiwani/proof-race
    autoDeployTrigger: "off" # deploy it deliberately; runs in flight keep their version
    buildCommand: npm ci --include=dev && npm run workflows:build
    startCommand: node dist/workflows.mjs
    buildFilter:
      paths: [apps/api/**, packages/**, package.json, package-lock.json]
      ignoredPaths: ["**/*.md"]
    envVars:
      - { key: NODE_VERSION, value: "24" }
      - { key: NODE_ENV, value: production }
      - { key: ANTHROPIC_API_KEY, sync: false }
      - { key: KERNEL_API_KEY, sync: false }
      - { key: WORKFLOWS_SECRET, sync: false }
