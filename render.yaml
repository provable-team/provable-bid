# Render Blueprint: https://render.com/docs/blueprint-spec
# Free web service running `next start`. SQLite lives on the instance's disk, which is ephemeral
# on the free plan, so a fresh instance seeds demo jobs (real PayPal sandbox captures) on boot.
services:
  - type: web
    name: provable-bid
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_PAYPAL_ENVIRONMENT
        value: sandbox
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false # set via the Render CLI / dashboard, never committed
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: APP_URL
        sync: false # https://<service>.onrender.com, used for the Log in with PayPal return URL
      # Optional: DEMO_OPERATOR_PAYER_ID, DEMO_OPERATOR_EMAIL, DEMO_AGENT_TOKEN
