          type: string
          enum:
            - text/html
        size_bytes:
          type: integer
          minimum: 1
          maximum: 524288
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        width:
          type: "null"
        height:
          type: "null"
        preview:
          $ref: "#/components/schemas/Preview"
