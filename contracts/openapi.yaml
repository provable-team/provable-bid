      description: "Operator credential only. Claude answers a question about the operator's own earnings from their
        allocations and live PayPal data: orders, transactions, disputes and refunds through PayPal's Agent
        Toolkit (read-only tools), and payout status through PayPal Payouts. Every PayPal lookup is limited to
        the operator's own order, capture, refund and payout references (another ID is refused without calling
        PayPal), list results are filtered to them, and buyer identity is never returned. Read-only, so no
        Idempotency-Key: each call is a new question. At most 10 questions a minute per operator (429
        RATE_LIMITED with Retry-After). 404 when the server has no Anthropic key or no PayPal provider
        (config.capabilities.operator_assistant is false)."
      requestBody:
        required: true
