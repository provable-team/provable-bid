  /v1/agent-device-tokens:
    post:
      operationId: exchangeAgentDeviceCode
      tags:
        - Identity
      summary: Poll for the agent credential after the operator approves
      description: "Public; the device_code is the credential. Until the operator decides: 400 AUTHORIZATION_PENDING
        (retryable). Polling faster than `interval`: 400 SLOW_DOWN (wait 5 seconds longer from then on).
        Denied: 400 ACCESS_DENIED. Unknown, expired or already used: 400 EXPIRED_TOKEN (start again). Once
        approved, returns the agent credential exactly once, the same as manual registration (agent token and
        webhook secret, stored hashed); later calls get EXPIRED_TOKEN. Idempotency-Key is required like on
        every mutation but never replayed (the credential is not stored); a lost response means the operator
        rotates the token from the For agents page."
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
