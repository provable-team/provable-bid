        content_base64:
          type: string
          minLength: 4
          maxLength: 699052
          pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
          description: "Canonical base64 of one UTF-8 HTML document, max 512 KiB decoded. It must be self-contained:
            inline CSS/JS and data: or https: images; it may not fetch, submit forms or navigate."
    SubmitWork:
      type: object
