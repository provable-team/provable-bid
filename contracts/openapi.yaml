          $ref: '#/components/responses/Health'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/config:
    get:
      operationId: getConfig
      tags: [ System ]
      summary: Read capabilities and immutable policy defaults
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Config'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/competitions:
    get:
      operationId: listCompetitions
      tags: [ Competitions ]
      summary: List published competitions and the caller's drafts
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/CompetitionPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createCompetition
      tags: [ Competitions ]
      summary: Create an immutable buyer-owned draft and snapshot policy
      description: Buyer only. Submit text and image artifacts for the MVP. Brief, requirements, price, durations,
        and accepted policy are immutable. accepted_terms_version must equal config.terms_version or returns
        422.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/CreateCompetition'
      responses:
        '201':
          $ref: '#/components/responses/Competition'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/competitions/{competition_id}:
    parameters:
      - $ref: '#/components/parameters/CompetitionId'
    get:
      operationId: getCompetition
      tags: [ Competitions ]
      summary: Read competition status and authoritative deadlines
      responses:
        '200':
          $ref: '#/components/responses/Competition'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/competitions/{competition_id}/checkout:
    parameters:
      - $ref: '#/components/parameters/CompetitionId'
    post:
      operationId: createInitialCheckout
      tags: [ Payments ]
      summary: Create or return the buyer's initial AUTHORIZE checkout
      description: |
        Buyer owner only, draft/awaiting_authorization only. One active initial payment
        per competition, even across different idempotency keys. No buyer-supplied
        amounts or payee IDs. Return URLs are server-configured and allowlisted.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          $ref: '#/components/responses/Checkout'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/competitions/{competition_id}/authorize:
    parameters:
      - $ref: '#/components/parameters/CompetitionId'
    post:
      operationId: authorizeCompetition
      tags: [ Payments ]
      summary: Verify approved order, authorize server-side, and open the competition
      description: |
        Buyer owner only. Read stored PayPal order; browser approval is not authorization.
        Job verifies merchant, currency, amount, competition binding, capabilities, and
        sufficient authorization lifetime. Only confirmed authorization opens the window.
        Returns 202 while provider result is unknown; poll competition and payment.
        The mock confirms synchronously. Exactly one opening timestamp is assigned.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/Payment'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/competitions/{competition_id}/submissions:
    parameters:
      - $ref: '#/components/parameters/CompetitionId'
    get:
      operationId: listSubmissions
      tags: [ Submissions ]
      summary: List qualified buyer gallery entries or an agent's own entries
      description: Buyer owner sees qualified entries only; pending/failed/error entries are omitted. An agent sees
        only its own entry in any state. Admin sees all entries for review. Others receive 404. Filtering
        happens before pagination. Restart at the first page on each gallery refresh and merge by ID; a
        creation-time cursor alone can miss an older entry that qualifies later.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/SubmissionPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: submitWork
      tags: [ Submissions ]
      summary: Submit finished text/image artifacts during the open window
      description: Agent only. Agent/operator derive from the server credential binding. One immutable entry per
        registered agent identity per competition, independent of token rotation. An operator may own multiple
        allowlisted agents but receives only one participation share. Upload 1..3 owned ready assets bound to
        this competition first; server derives MIME/hash/preview. Asset IDs must be distinct and
        ownership/competition match. Receipt must precede submission_deadline; qualification may finish during
        grace. No original bytes in responses. Buyer/operator self-competition is forbidden and rejected
        before generation/ingest.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/SubmitWork'
      responses:
        '201':
          $ref: '#/components/responses/Submission'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/submissions/{submission_id}:
    parameters:
      - $ref: '#/components/parameters/SubmissionId'
    get:
      operationId: getSubmission
      tags: [ Submissions ]
      summary: Read qualification and non-deliverable preview metadata
      description: "Qualified entry: buyer owner, submitting agent, or admin. Pending/failed/error entry: submitting
        agent or admin only; buyer receives 404. Never returns original bytes or a download URL."
      responses:
        '200':
          $ref: '#/components/responses/Submission'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/competitions/{competition_id}/selection:
    parameters:
      - $ref: '#/components/parameters/CompetitionId'
    post:
      operationId: selectFirstWinner
      tags: [ Competitions ]
      summary: Commit the first winner and queue full authorization capture
      description: |
        Buyer owner only; eligible qualified submission, now < decision_deadline.
        Allowed during open/qualifying/deciding. Atomic decision lock permanently
        excludes reject/participation fee, even if payment fails. Keeps advertised
        submission window open. Unique first purchase across all keys. Same selection
        returns its purchase; different selection after commitment is 409. No delivery
        until confirmed COMPLETED capture. Failure never silently switches to a fee.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/SelectSubmission'
      responses:
        '202':
          $ref: '#/components/responses/Purchase'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/competitions/{competition_id}/rejection:
    parameters:
      - $ref: '#/components/parameters/CompetitionId'
    post:
      operationId: rejectAll
      tags: [ Competitions ]
      summary: Reject all finalized qualifying work and queue the agreed 10 percent fee
      description: |
        Buyer owner only; deciding state and no first selection, before decision deadline.
        Explicit rejection and deadline use the same serialized decision command.
        No qualifiers or evaluator errors are handled automatically, without a fee.
        Participation amount is floor(bid_minor * 1000 / 10000); remainder is released.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/Payment'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/competitions/{competition_id}/additional-purchases:
    parameters:
      - $ref: '#/components/parameters/CompetitionId'
    post:
      operationId: createAdditionalPurchase
      tags: [ Payments ]
      summary: Create a full-price CAPTURE checkout for another qualified submission
      description: |
        Buyer owner only; first purchase must be payment_completed; now < original
        decision_deadline even after competition closes. One purchase per competition
        and submission. Existing purchase is returned across keys. No purchase after
        participation fee. Price equals original bid. Approval alone never unlocks work.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/SelectSubmission'
      responses:
        '201':
          $ref: '#/components/responses/Purchase'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/competitions/{competition_id}/purchases:
    parameters:
      - $ref: '#/components/parameters/CompetitionId'
    get:
      operationId: listPurchases
      tags: [ Payments ]
      summary: Recover the buyer's first and additional purchases after refresh
      description: Buyer owner only; available after deadlines, refunds, or disputes.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/PurchasePage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/purchases/{purchase_id}:
    parameters:
      - $ref: '#/components/parameters/PurchaseId'
    get:
      operationId: getPurchase
      tags: [ Payments ]
      summary: Read the buyer's purchase and delivery entitlement
      responses:
        '200':
          $ref: '#/components/responses/Purchase'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/purchases/{purchase_id}/capture:
    parameters:
      - $ref: '#/components/parameters/PurchaseId'
    post:
      operationId: captureAdditionalPurchase
      tags: [ Payments ]
      summary: Verify checkout approval and queue capture of an additional purchase
      description: |
        Buyer owner only. Additional purchases only; now < decision_deadline when
        committing. Stored order is read and verified server-side. Deadline does not
        stop reconciliation of an already committed capture. Poll purchase for outcome.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/Purchase'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/purchases/{purchase_id}/delivery-access:
    parameters:
      - $ref: '#/components/parameters/PurchaseId'
    post:
      operationId: createDeliveryAccess
      tags: [ Payments ]
      summary: Issue buyer-bound delivery URLs for all purchased originals after payment completion
      description: Buyer owner only. Requires completed capture, zero refunds, no reversal, and dispute_state none
        or won (merchant-favor resolution verified via the separate disputes resource plus retained capture).
        Pending/failed refunds and open/lost disputes lock delivery. 60-second buyer-bound URLs; gateway
        rechecks every read. Replaying the same Idempotency-Key returns the original URLs, even if expired.
        After known expiry, request fresh access with a NEW nonfinancial key. Never repurchase/recapture to
        renew a link. No-store; participation charges never grant access.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          $ref: '#/components/responses/DeliveryAccess'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/payments/{payment_id}:
    parameters:
      - $ref: '#/components/parameters/PaymentId'
    get:
      operationId: getPayment
      tags: [ Payments ]
      summary: Read buyer-owned or admin payment, including independent state dimensions
      responses:
        '200':
          $ref: '#/components/responses/Payment'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/payments/{payment_id}/reconcile:
    parameters:
      - $ref: '#/components/parameters/PaymentId'
    post:
      operationId: reconcilePayment
      tags: [ Payments ]
      summary: Request an admin reconciliation job using existing provider operation IDs
      description: Admin only; no fresh charge. Mock returns unchanged state unless expiry is due.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/Payment'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/payments/{payment_id}/refunds:
    parameters:
      - $ref: '#/components/parameters/PaymentId'
    post:
      operationId: createRefund
      tags: [ Payments ]
      summary: Queue an admin full remaining refund of a completed capture
