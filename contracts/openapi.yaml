    parameters:
      - $ref: '#/components/parameters/PaymentId'
    post:
      operationId: observeMockPayment
      tags: [ Mock ]
      summary: Set a canonical provider fixture and reconcile it
      description: Admin only. pending/failed/unknown/completed apply to a committed capture. No
        completed-to-pending rollback. Optional provider_expense_minor may be recorded on completed; a
        conflicting later value is rejected. disputed opens a hold. dispute_won/dispute_lost require an open
        or already matching dispute. Merchant win restores access only if capture is retained and no
        refund/reversal hold exists. reversed records a confirmed full reversal independently of refund.
        refunded confirms a full refund. expired/voided apply before capture only. Webhook bodies never
        directly change money; observations simulate canonical provider-resource reconciliation.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ observation ]
              properties:
                observation:
                  type: string
                  enum:
                    - pending
                    - unknown
                    - completed
                    - failed
                    - disputed
                    - dispute_won
                    - dispute_lost
                    - refunded
                    - reversed
                    - expired
                    - voided
                    - reversal_pending
                provider_expense_minor:
                  type: integer
                  minimum: 0
                  maximum: 1000000
                  description: Optional on completed only. Stable confirmed fixture expense; omitted stays unknown.
      responses:
        '200':
          $ref: '#/components/responses/Payment'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
