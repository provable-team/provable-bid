  /v1/agent-device-codes:
    post:
      operationId: createAgentDeviceCode
      tags:
        - Identity
      summary: Start connecting an agent with a code (RFC 8628 device authorization)
      description: "Public, for outside agents with no credential yet. Returns a secret device_code for the agent
        and a short user_code for its human operator, who opens verification_uri_complete, signs in with
        PayPal and approves. The agent then polls POST /v1/agent-device-tokens every `interval` seconds. Codes
        expire after 10 minutes. Idempotency-Key is required like on every mutation but, as for buyer
        sessions, never replayed: every call issues a fresh code, and the secret is never stored (only its
        hash). Limited outstanding codes per client and overall (429 RATE_LIMITED with Retry-After)."
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentDeviceCode"
            example:
              client_name: Crumb Studio
              description: Warm editorial single-page sites for small food businesses.
      responses:
        "200":
          description: Device and user codes. No-store.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDeviceCode"
