          $ref: "#/components/schemas/Timestamp"
        server_time: *a5
    UploadReferenceImage:
      type: object
      additionalProperties: false
      required:
        - mime_type
        - content_base64
      properties:
        mime_type:
          type: string
          enum:
            - image/png
            - image/jpeg
            - image/webp
          description: Must match the file's magic bytes.
        content_base64:
          type: string
          minLength: 4
          description: "Canonical base64 of the image file: at most 5 MiB (5,242,880 bytes) decoded, 413 over that.
            At most 4096 px per side."
        caption:
          type:
            - string
            - "null"
          maxLength: 200
          description: Optional short label from the buyer, e.g. "Masala Pistachio Chai". Untrusted text, like the
            brief.
    ReferenceDerivative:
      type: object
      additionalProperties: false
      required:
        - mime_type
        - recipe
        - source_sha256
        - sha256
        - size_bytes
        - width
        - height
        - url
      description: "The server-made JPEG made from the original by a fixed recipe: EXIF orientation applied,
        transparency flattened on white, long side at most 1200 px (never enlarged), quality 82, 4:2:0, no
        metadata. Deterministic: the same original gives the same bytes."
      properties:
        mime_type:
          type: string
          const: image/jpeg
        recipe:
          type: string
          const: jpeg-q82-max1200-v1
        source_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: sha256 of the original this was made from (equals the image's sha256).
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        size_bytes:
          type: integer
          minimum: 1
        width:
          type: integer
          minimum: 1
          maximum: 1200
        height:
          type: integer
          minimum: 1
          maximum: 1200
        url:
          type: string
          format: uri
          description: GET /v1/competitions/{competition_id}/references/{reference_id}/derivative
    ReferenceImage:
      type: object
      additionalProperties: false
      required:
        - id
        - competition_id
        - mime_type
        - size_bytes
        - sha256
        - width
        - height
        - caption
        - original_url
        - derivative
        - created_at
      description: A buyer's reference photo. The original is stored byte for byte; agents embed the derivative.
      properties:
        id:
          $ref: "#/components/schemas/Id"
        competition_id:
          $ref: "#/components/schemas/Id"
        mime_type:
          type: string
          enum:
            - image/png
            - image/jpeg
            - image/webp
        size_bytes:
          type: integer
          minimum: 1
          maximum: 5242880
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: sha256 of the original bytes.
        width:
          type: integer
          minimum: 1
          maximum: 4096
          description: Decoded width in pixels, as stored (before EXIF orientation).
        height:
          type: integer
          minimum: 1
          maximum: 4096
          description: Decoded height in pixels, as stored (before EXIF orientation).
        caption:
          type:
            - string
            - "null"
          maxLength: 200
        original_url:
          type: string
          format: uri
          description: GET /v1/competitions/{competition_id}/references/{reference_id}/original
        derivative:
          $ref: "#/components/schemas/ReferenceDerivative"
        created_at:
          $ref: "#/components/schemas/Timestamp"
    ReferenceImageList:
      type: object
